<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exa List Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Left Sidebar - Chat History -->
    <aside class="left-sidebar" id="leftSidebar">
      <div class="left-sidebar-header">
        <h2 class="sidebar-title">Exa List Generator</h2>
        <button class="new-chat-btn" onclick="startNewChat()" title="New List">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New List</span>
        </button>
      </div>
      <div class="chat-history-list" id="chatHistoryList">
        <!-- Chat history items will be added here -->
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Home View (shown when no messages) -->
      <div class="home-view" id="homeView">
        <div class="greeting-section">
          <div class="greeting">
            <h1 class="greeting-text">Generate Accurate Lists</h1>
            <p class="tagline">Powered by Exa Search and Claude AI</p>
          </div>

          <div class="example-prompts">
            <h3>Try these examples:</h3>
            <div class="example-grid">
              <button class="example-card" onclick="fillPrompt('Generate a list of top secondary market investors in tech')">
                <div class="example-icon">📊</div>
                <div class="example-text">Secondary Market Investors</div>
              </button>
              <button class="example-card" onclick="fillPrompt('Create a market map of AI infrastructure companies')">
                <div class="example-icon">🗺️</div>
                <div class="example-text">AI Infrastructure Market Map</div>
              </button>
              <button class="example-card" onclick="fillPrompt('List Y Combinator companies from the last 3 batches')">
                <div class="example-icon">🚀</div>
                <div class="example-text">YC Companies</div>
              </button>
              <button class="example-card" onclick="fillPrompt('Find top venture capital firms focused on climate tech')">
                <div class="example-icon">🌱</div>
                <div class="example-text">Climate Tech VCs</div>
              </button>
            </div>
          </div>
        </div>

        <div class="input-container home-input">
          <form id="homeForm" class="input-form">
            <div class="input-wrapper">
              <textarea
                id="homeInput"
                class="message-input"
                placeholder="Describe the list you want to generate..."
                rows="1"
                autocomplete="off"
              ></textarea>
              <button type="submit" class="send-btn" title="Send">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Chat View (shown when there are messages) -->
      <div class="chat-view" id="chatView" style="display: none;">
        <div class="messages-container" id="messagesContainer">
          <!-- Messages will be added here -->
        </div>

        <div class="input-container chat-input">
          <form id="chatForm" class="input-form">
            <div class="input-wrapper">
              <textarea
                id="chatInput"
                class="message-input"
                placeholder="Refine your list or ask a follow-up question..."
                rows="1"
                autocomplete="off"
              ></textarea>
              <button type="submit" class="send-btn" title="Send">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Export Modal -->
  <div id="exportModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Export List</h2>
        <button class="close-modal" onclick="closeExportModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="export-options">
          <button class="export-option" onclick="exportList('excel')">
            <div class="export-icon">📊</div>
            <div class="export-text">
              <div class="export-title">Excel (.xlsx)</div>
              <div class="export-desc">Download as Excel spreadsheet</div>
            </div>
          </button>
          <button class="export-option" onclick="exportList('csv')">
            <div class="export-icon">📄</div>
            <div class="export-text">
              <div class="export-title">CSV</div>
              <div class="export-desc">Download as CSV file</div>
            </div>
          </button>
          <button class="export-option" onclick="exportList('airtable')">
            <div class="export-icon">🗂️</div>
            <div class="export-text">
              <div class="export-title">Airtable</div>
              <div class="export-desc">Create new Airtable base</div>
            </div>
          </button>
          <button class="export-option" onclick="exportList('googlesheets')">
            <div class="export-icon">📗</div>
            <div class="export-text">
              <div class="export-title">Google Sheets</div>
              <div class="export-desc">Create new Google Sheet</div>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
