<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exa List Generator - Test Interface</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F0F0F;
      color: #ECECEC;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      background: linear-gradient(135deg, #6B46C1 0%, #9F7AEA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .status {
      background: #1A1A1A;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #2A2A2A;
    }
    .status.connected { border-color: #10B981; }
    .input-area {
      background: #1A1A1A;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #2A2A2A;
    }
    textarea {
      width: 100%;
      background: #0F0F0F;
      border: 1px solid #2A2A2A;
      color: #ECECEC;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
    }
    button {
      background: #6B46C1;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      margin-top: 10px;
    }
    button:hover { background: #7C3AED; }
    button:disabled { background: #4A4A4A; cursor: not-allowed; }
    .examples {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .example {
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .example:hover { border-color: #6B46C1; background: #242424; }
    .messages {
      background: #1A1A1A;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2A2A2A;
      min-height: 300px;
      max-height: 500px;
      overflow-y: auto;
    }
    .message {
      margin-bottom: 20px;
      padding: 15px;
      background: #242424;
      border-radius: 8px;
    }
    .message.user { background: #2A2A2A; }
    .message.assistant { background: #1A1A1A; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      background: #0F0F0F;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #2A2A2A;
    }
    th {
      background: #242424;
      color: #9F7AEA;
      font-weight: 600;
    }
    .export-btn {
      background: #10B981;
      margin-right: 10px;
      margin-top: 10px;
    }
    .export-btn:hover { background: #059669; }
    .error { color: #EF4444; background: #3F1F1F; padding: 10px; border-radius: 6px; }
    .loading { color: #9F7AEA; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Exa List Generator</h1>
    <p style="color: #A0A0A0; margin-bottom: 20px;">Test Interface - Backend running on http://localhost:3001</p>

    <div class="status" id="status">
      <strong>Status:</strong> Checking connection...
    </div>

    <div class="examples">
      <div class="example" onclick="fillPrompt('Generate a list of top secondary market investors in tech')">
        📊 Secondary Market Investors
      </div>
      <div class="example" onclick="fillPrompt('Create a market map of AI infrastructure companies')">
        🗺️ AI Infrastructure Market Map
      </div>
      <div class="example" onclick="fillPrompt('List Y Combinator companies from the last 3 batches')">
        🚀 YC Companies
      </div>
      <div class="example" onclick="fillPrompt('Find top venture capital firms focused on climate tech')">
        🌱 Climate Tech VCs
      </div>
    </div>

    <div class="input-area">
      <textarea id="prompt" placeholder="Describe the list you want to generate..."></textarea>
      <button onclick="generateList()" id="generateBtn">Generate List</button>
    </div>

    <div class="messages" id="messages"></div>
  </div>

  <script>
    let currentChatId = `chat_${Date.now()}`;
    let currentListData = null;

    // Check server health
    async function checkHealth() {
      try {
        const res = await fetch('http://localhost:3001/api/health');
        const data = await res.json();
        document.getElementById('status').innerHTML = `
          <strong>Status:</strong> <span style="color: #10B981;">✓ Connected</span> - Provider: ${data.provider}
        `;
        document.getElementById('status').className = 'status connected';
      } catch (e) {
        document.getElementById('status').innerHTML = `
          <strong>Status:</strong> <span style="color: #EF4444;">✗ Disconnected</span> - ${e.message}
        `;
      }
    }

    function fillPrompt(text) {
      document.getElementById('prompt').value = text;
    }

    function addMessage(content, type = 'assistant') {
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.innerHTML = content;
      document.getElementById('messages').appendChild(msg);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    async function generateList() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.textContent = 'Generating...';

      // Add user message
      addMessage(prompt, 'user');

      let accumulatedText = '';
      const assistantDiv = document.createElement('div');
      assistantDiv.className = 'message assistant';
      document.getElementById('messages').appendChild(assistantDiv);

      try {
        const response = await fetch('http://localhost:3001/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt, chatId: currentChatId })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.slice(6));

              if (data.type === 'text') {
                accumulatedText += data.content;
                assistantDiv.innerHTML = marked.parse(accumulatedText);
              } else if (data.type === 'list_generated') {
                currentListData = data;
                displayTable(data);
              } else if (data.type === 'error') {
                assistantDiv.innerHTML += `<div class="error">Error: ${data.content}</div>`;
              }
            }
          }
        }
      } catch (error) {
        assistantDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate List';
      }
    }

    function displayTable(listData) {
      let html = '<table><thead><tr>';
      listData.columns.forEach(col => {
        html += `<th>${col}</th>`;
      });
      html += '</tr></thead><tbody>';

      listData.data.forEach(row => {
        html += '<tr>';
        listData.columns.forEach(col => {
          html += `<td>${row[col] || 'N/A'}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table>';

      html += `
        <button class="export-btn" onclick="exportData('excel')">📊 Export to Excel</button>
        <button class="export-btn" onclick="exportData('csv')">📄 Export to CSV</button>
      `;

      const tableDiv = document.createElement('div');
      tableDiv.className = 'message assistant';
      tableDiv.innerHTML = html;
      document.getElementById('messages').appendChild(tableDiv);
    }

    async function exportData(format) {
      try {
        const response = await fetch(`http://localhost:3001/api/export/${format}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId: currentChatId })
        });

        if (!response.ok) throw new Error('Export failed');

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `list.${format === 'excel' ? 'xlsx' : 'csv'}`;
        a.click();
        window.URL.revokeObjectURL(url);
      } catch (error) {
        alert(`Export error: ${error.message}`);
      }
    }

    // Check health on load
    checkHealth();
    setInterval(checkHealth, 5000);
  </script>
</body>
</html>
